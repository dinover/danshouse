<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dan's House</title>
<meta name="description" content="La carta de Dan's House. Todo lo que aparece, hay con qué hacerlo.">
<meta name="theme-color" content="#0e0d0b">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo-line"><h1>Dan's House</h1></div>
    <p class="subtitle">menú de la casa</p>
    <div class="aviso" id="aviso">
      Cargando lo que hay en casa…
    </div>
  </header>

  <nav id="nav"></nav>

  <div class="controls">
    <input class="search" id="buscar" type="text" placeholder="Buscar un plato o un ingrediente…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>

  <main id="carta"></main>

  <footer>
    <p>Dan's House · con amor</p>
    <p class="sello"><a href="/admin">cocina</a></p>
  </footer>

</div>

<script type="module">
import { fetchState } from '/assets/api.js';
import { buildMenu, entryName, nameIndex } from '/assets/engine.js';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const view = { seccion: 'todo', busqueda: '', tags: new Set(), casi: false };
let data = null, menu = null, names = null, basicos = new Set();

/* Un plato entra en la búsqueda por su nombre, su descripción o sus ingredientes. */
function coincide(entrada) {
  const q = view.busqueda.trim().toLowerCase();
  if (!q) return true;
  const ings = [...(entrada.recipe.need || []), ...(entrada.recipe.opt || [])]
    .flat().map(id => names.get(id) || id).join(' ');
  return `${entrada.recipe.name} ${entrada.recipe.desc || ''} ${ings}`.toLowerCase().includes(q);
}

function pasaTags(entrada) {
  if (!view.tags.size) return true;
  return (entrada.recipe.tags || []).some(t => view.tags.has(t));
}

const visibles = lista => lista.filter(e => coincide(e) && pasaTags(e));

function itemHTML(entrada, { falta = false } = {}) {
  const { recipe, extras, missing } = entrada;
  const tags = (recipe.tags || []).map(t => `<span class="tag tag-${esc(t)}">${esc(t)}</span>`).join('');
  const suma = extras.filter(id => !basicos.has(id));
  const conQue = suma.length
    ? `<div class="item-extras">con ${suma.map(id => esc(names.get(id) || id)).join(' · ')}</div>` : '';
  const faltan = falta
    ? `<div class="item-falta">falta ${missing.map(e => esc(entryName(e, names))).join(' · ')}</div>` : '';
  return `<div class="item${falta ? ' falta' : ''}">
    <div class="item-left">
      <div class="item-top"><span class="item-name">${esc(recipe.name)}</span>${tags}</div>
      ${recipe.desc ? `<div class="item-desc">${esc(recipe.desc)}</div>` : ''}
      ${conQue}${faltan}
    </div>
  </div>`;
}

/* Los granos son ingredientes como cualquier otro: la card muestra los que hay.
   Se dibuja sólo si la receta en sí está disponible, para no prometer de más. */
function prensaHTML(listos) {
  if (!listos.some(e => e.recipe.hero && e.recipe.section === 'cafes')) return '';
  const granos = data.ingredients.filter(i => i.bean && menu.pantry.has(i.id));
  if (!granos.length) return '';
  const porMarca = new Map();
  for (const g of granos) {
    if (!porMarca.has(g.brand)) porMarca.set(g.brand, []);
    porMarca.get(g.brand).push(g.name);
  }
  const bloques = [...porMarca].map(([marca, lista]) => `
      <div class="granos-label">${esc(marca)}</div>
      <div class="granos">${lista.map(n => `<div class="grano">${esc(n)}</div>`).join('')}</div>`).join('');
  return `<div class="prensa-card">
      <div class="prensa-name">Prensa Francesa</div>
      <div class="prensa-tagline">Granos de especialidad · selección del momento</div>
      <p class="prensa-desc">Preparado en prensa francesa. Esto es lo que hay hoy.</p>
      ${bloques}
    </div>`;
}

function render() {
  const listos = visibles(menu.ready);
  const casi = view.casi ? visibles(menu.near) : [];

  // Nav: cada sección con su cuenta real, atenuada si no hay nada.
  const cuentas = new Map(data.sections.map(s => [s.id, listos.filter(e => e.recipe.section === s.id).length]));
  $('nav').innerHTML = [
    { id: 'todo', name: 'Todo', n: listos.length },
    ...data.sections.map(s => ({ id: s.id, name: s.name, n: cuentas.get(s.id) })),
  ].map(s => `<button data-sec="${s.id}" class="${view.seccion === s.id ? 'active' : ''}${s.n ? '' : ' empty'}">${esc(s.name)}<span class="n">${s.n}</span></button>`).join('');

  const secciones = view.seccion === 'todo'
    ? data.sections
    : data.sections.filter(s => s.id === view.seccion);

  let html = '';
  for (const sec of secciones) {
    const items = listos.filter(e => e.recipe.section === sec.id);
    const cafe = sec.id === 'cafes' ? prensaHTML(listos) : '';
    if (!items.length && !cafe) continue;
    html += `<p class="section-label">${esc(sec.label)}</p>`;
    if (cafe) html += cafe;
    // El café tiene su propia card; el resto va como lista.
    const resto = items.filter(e => !e.recipe.hero);
    if (resto.length) html += `<div class="${cafe ? 'otros-cafes' : ''}">${resto.map(e => itemHTML(e)).join('')}</div>`;
  }

  if (!html) {
    html = view.busqueda || view.tags.size
      ? `<div class="vacio"><strong>Nada con eso</strong>Probá con otra búsqueda o sacá los filtros.</div>`
      : `<div class="vacio"><strong>La heladera está vacía</strong>Dan todavía no cargó lo que hay en casa.<br>Volvé en un rato.</div>`;
  }

  if (casi.length) {
    const porSeccion = view.seccion === 'todo' ? casi : casi.filter(e => e.recipe.section === view.seccion);
    if (porSeccion.length) {
      html += `<p class="section-label">A un paso</p>` + porSeccion.map(e => itemHTML(e, { falta: true })).join('');
    }
  }

  $('carta').innerHTML = html;
}

function renderAviso() {
  const n = menu.ready.length;
  const frase = n === 0 ? 'No hay nada listo en este momento.'
    : n === 1 ? 'Hay <span class="count">1 cosa</span> lista para hacer ahora.'
    : `Hay <span class="count">${n} cosas</span> listas para hacer ahora.`;
  $('aviso').innerHTML = `${frase}<br><strong>Todo lo que ves, hay con qué hacerlo.</strong>`;
}

function renderChips() {
  const usados = new Set(menu.ready.flatMap(e => e.recipe.tags || []));
  const tags = (data.tags || []).filter(t => usados.has(t));
  $('chips').innerHTML = tags
    .map(t => `<button class="chip${view.tags.has(t) ? ' on' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')
    + `<button class="chip${view.casi ? ' on' : ''}" data-casi="1">a un paso</button>`;
}

function refresh() {
  menu = buildMenu(data);
  names = nameIndex(data);
  basicos = new Set(data.ingredients.filter(i => i.staple).map(i => i.id));
  renderAviso();
  renderChips();
  render();
}

$('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-sec]');
  if (!b) return;
  view.seccion = b.dataset.sec;
  render();
});

$('chips').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.casi) view.casi = !view.casi;
  else if (view.tags.has(b.dataset.tag)) view.tags.delete(b.dataset.tag);
  else view.tags.add(b.dataset.tag);
  renderChips();
  render();
});

let timer;
$('buscar').addEventListener('input', e => {
  view.busqueda = e.target.value;
  clearTimeout(timer);
  timer = setTimeout(render, 120);
});

try {
  data = await fetchState();
  refresh();
} catch (err) {
  $('aviso').innerHTML = `<strong>No pude cargar la carta.</strong><br>${esc(err.message)}`;
}
</script>
</body>
</html>
